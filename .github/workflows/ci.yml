name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Compuerta de evals adversariales
        run: python -m secmcp.evals --gate --out results/evals.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "evals-${{ matrix.python }}"
          path: results/evals.md

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen CPU
        uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: "secmcp:ci" }
      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name secmcp-smoke -p 8000:8000 -e BACKEND=mock secmcp:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fs localhost:8000/readyz; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then docker logs secmcp-smoke; exit 1; fi
          curl -fs -X POST localhost:8000/v1/chat/completions -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"hola"}]}'
      - name: Limpiar contenedor de la prueba
        if: always()
        run: docker rm -f secmcp-smoke || true
      - name: Escaneo de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: secmcp:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Iniciar sesión en GHCR (solo main)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagen CPU en GHCR (solo main)
        if: github.ref == 'refs/heads/main'
        run: |
          IMG=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag secmcp:ci "$IMG:${{ github.sha }}"
          docker tag secmcp:ci "$IMG:latest"
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"
      - name: Liberar espacio en el runner (la imagen GPU es grande)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android && df -h /
      - name: Construir imagen GPU para escanearla (local, sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          load: true
          tags: secmcp-gpu:ci
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,scope=gpu,mode=max
      - name: Escaneo de vulnerabilidades de la imagen GPU (informativo, no bloquea)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: secmcp-gpu:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
      - name: Construir imagen GPU (se publica solo en main, etiqueta gpu)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}:gpu
          cache-from: type=gha,scope=gpu

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
